services:
  http:
    build:
      context: ../../..
      dockerfile: http/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres-avito-informer
    ports:
      - "${EXTERNAL_HTTP_PORT}:${HTTP_PORT}"
    networks:
      - avito-informer-net

  collector:
    build:
      context: ../../..
      dockerfile: collector/Dockerfile
    env_file:
      - .env
    environment:
      # flip to "true" (with VNC_PASSWORD in .env) for the one-time profile login
      VNC_ENABLED: "${COLLECTOR_VNC_ENABLED:-false}"
    depends_on:
      - postgres-avito-informer
    networks:
      - avito-informer-net
    ports:
      # VNC — only reachable when VNC_ENABLED=true; bound to localhost
      - "127.0.0.1:${COLLECTOR_VNC_PORT:-5900}:5900"
    volumes:
      - avito_profile:/data/avito-profile
    restart: unless-stopped
    shm_size: "2g"
    mem_limit: 2g

  notification:
    build:
      context: ../../..
      dockerfile: notification/Dockerfile
    env_file:
      - .env
    depends_on:
      - postgres-avito-informer
    networks:
      - avito-informer-net

  postgres-avito-informer:
    image: postgres:17.0-alpine3.20
    container_name: postgres-avito-informer
    hostname: postgres_avito_informer
    env_file:
      - .env
    volumes:
      - postgres_avito_informer_data:/var/lib/postgresql/data
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - avito-informer-net

volumes:
  postgres_avito_informer_data:
  avito_profile:

networks:
  avito-informer-net:
    name: avito-informer-net
    external: false
